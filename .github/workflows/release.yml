# Build one immutable release candidate -- binary, platform bundle and
# migration-runner image -- from one tagged revision, and record it as a draft
# release. The tag never publishes.
#
#   v<version> candidate (draft, unpublished)
#   ├── bin/sol                       built with SOL_RELEASE_VERSION=<version>
#   ├── share/sol/<version>/platform  this tag's platform/ tree
#   ├── share/sol/<version>/REVISION  the revision this candidate was built from,
#   │                                 so a live run can bind the application it
#   │                                 builds to this candidate and no other
#   ├── migration-runner-image        ghcr.io/<owner>/sol-migration-runner@sha256:...
#   │                                 the same binary, published once
#   ├── setup-image                   postgres@sha256:...
#   │                                 the pinned PUBLIC database setup image: a release that
#   │                                 provisions a database resolves it from its own bundle, so
#   │                                 a deploy never depends on an ambient variable (#1427)
#   ├── candidate.json                the candidate identity: revision, bundle
#   │                                 digest and runner digest
#   └── SUPPORT_REFS                  this tag's support-refs.txt, containing the
#                                     exact support-library revisions it was built from
#
# The runner is recorded only once a fresh cluster could actually pull it: the
# exact recorded digest must resolve anonymously, because a fresh AWS or GCP
# workload has no registry credential and `ghcr.io` packages are private by
# default. The candidate fails closed here, before anything is recorded, rather
# than failing an hour into live qualification.
#
# Promotion is a separate workflow (`promote.yml`). It publishes this exact draft
# candidate only after an operator-authorized AWS and GCP qualification verdict,
# attached to the candidate, refers to the same revision, bundle and runner. The
# tag never publishes, so qualification always precedes publication and a
# published version is never rebuilt.
#
# A version's candidate is built once: a re-run reuses the recorded candidate
# only when it matches the rebuild, so the candidate cannot move underneath a
# qualification run.
#
# A release binary without its platform bundle refuses to run rather than guess.
name: Release candidate

on:
  push:
    tags: ['v*']
  # The tag push is the normal path. workflow_dispatch is the recovery path: the
  # workflow definition comes from the default branch, so a candidate build that
  # was interrupted can be resumed without moving the tag. The candidate is still
  # built from the tag's tree below.
  workflow_dispatch:
    inputs:
      version:
        description: 'The release tag to build or resume, e.g. v0.1.0-alpha.8'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-candidate-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      RUNNER_REPO: ghcr.io/${{ github.repository_owner }}/sol-migration-runner
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      runner_image: ${{ steps.runner.outputs.image }}
    steps:
      # The tagged tree on both paths: the candidate is built from the revision
      # the version names, never from the default branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0

      # The candidate is tied to its own tag: this refuses a branch, a checkout
      # that is not the tag's commit, and an already-published version, before
      # anything is built. A draft is this version's recorded candidate and is
      # resumed below.
      - name: Require a tag, resolve the candidate revision, and refuse a published version
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision="$(git rev-parse HEAD)"
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}" >/dev/null; then
            echo "::error::$VERSION is not a tag; refusing to build a candidate for a version that names a branch"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$VERSION^{commit}")" != "$revision" ]; then
            echo "::error::$VERSION does not point at the checked-out revision $revision"
            exit 1
          fi
          if gh release view "$VERSION" --json isDraft --jq .isDraft >"$RUNNER_TEMP/is-draft.txt" 2>/dev/null \
            && [ "$(cat "$RUNNER_TEMP/is-draft.txt")" != "true" ]; then
            echo "::error::$VERSION is already published, and a version is published once"
            exit 1
          fi
          echo "revision=$revision" >>"$GITHUB_OUTPUT"
          echo "building the candidate for $VERSION from $revision"

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Pin extracted opam packages
        uses: ./.github/actions/pin-opam-packages

      - name: Install OCaml dependencies
        run: opam install . --deps-only -y

      - name: Prepare Sol framework packages (DEC-025)
        run: bash platform/local/scripts/prepare-framework-deps.sh

      - name: Development build (the smoke's control binary)
        run: |
          opam exec -- dune build cli/bin/main.exe
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/sol-dev"

      - name: Release build
        run: |
          SOL_RELEASE_VERSION="$VERSION" opam exec -- dune build cli/bin/main.exe
          mkdir -p "$RUNNER_TEMP/runner"
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/runner/sol"
          got="$("$RUNNER_TEMP/runner/sol" --version)"
          [ "$got" = "$VERSION" ] || { echo "::error::built binary reports $got, not $VERSION"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The runner image is published once and never overwritten: if the tag is
      # already in the registry this reuses its digest, so an interrupted
      # candidate build resumes instead of failing. Sol consumes the immutable
      # digest.
      - name: Publish the migration runner, once
        id: runner
        run: |
          if docker pull --quiet "$RUNNER_REPO:$VERSION" >/dev/null 2>&1; then
            echo "$RUNNER_REPO:$VERSION is already published; reusing its digest rather than overwriting it"
          else
            docker build -f internal/tooling/release/migration-runner.Dockerfile \
              -t "$RUNNER_REPO:$VERSION" "$RUNNER_TEMP/runner"
            docker push "$RUNNER_REPO:$VERSION"
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$RUNNER_REPO:$VERSION")"
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for the published runner ($digest)"; exit 1; }
          echo "image=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve the database setup image
        id: setup
        env:
          SETUP_IMAGE: ${{ vars.SOL_SETUP_POSTGRES_IMAGE }}
        run: |
          # Public image, so there is nothing to publish -- but it must be *pinned* and shipped
          # with the release, because an installed release refuses an ambient variable and a
          # mutable tag under a Job holding the database's administrative credential is not
          # acceptable. The variable is required: a candidate that cannot name the image it
          # tests must fail here rather than fail a deploy after it created a database.
          [[ "$SETUP_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::repository variable SOL_SETUP_POSTGRES_IMAGE must hold the pinned digest of the public PostgreSQL setup image (postgres@sha256:<64 hex>)"; exit 1; }
          echo "image=$SETUP_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build the release archive
        id: bundle
        run: |
          archive="$(internal/tooling/scripts/build-release-bundle.sh \
            --version "$VERSION" \
            --revision "${{ steps.revision.outputs.revision }}" \
            --runner-image "${{ steps.runner.outputs.image }}" \
            --setup-image "${{ steps.setup.outputs.image }}" \
            --binary "$RUNNER_TEMP/runner/sol" \
            --support-refs support-refs.txt \
            --out "$RUNNER_TEMP/dist" | tail -1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Record the candidate identity
        run: |
          python3 internal/tooling/release/promotion.py record \
            --version "$VERSION" \
            --revision "${{ steps.revision.outputs.revision }}" \
            --bundle "${{ steps.bundle.outputs.archive }}" \
            --runner-image "${{ steps.runner.outputs.image }}" \
            --out "$RUNNER_TEMP/candidate.json"

      # A fresh AWS or GCP cluster receives no registry credentials, so the
      # recorded runner must be anonymously pullable by its exact digest. This is
      # the boundary #1272 crossed: the push succeeded while every clean workload
      # got 401. Nothing is recorded until this passes.
      - name: Establish that a fresh cluster can pull the recorded runner
        run: |
          internal/tooling/release/verify_runner_image.sh "$RUNNER_TEMP/candidate.json"

      - name: Installed-release smoke
        run: |
          internal/ci/smoke_installed_release.sh \
            "${{ steps.bundle.outputs.archive }}" "$VERSION" \
            "${{ steps.runner.outputs.image }}" "$RUNNER_TEMP/sol-dev"

      # The candidate is recorded as a draft release: the bundle and the
      # candidate identity are attached, but nothing is published. A re-run only
      # succeeds when the recorded candidate matches the rebuild, so the
      # candidate cannot move underneath a qualification run.
      - name: Record the candidate as a draft release, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          candidate_notes="$RUNNER_TEMP/candidate-notes.md"
          {
            printf 'Sol %s release candidate. Not published.\n\n' "$VERSION"
            printf 'Source revision: `%s`\n\n' "${{ steps.revision.outputs.revision }}"
            printf 'Migration runner: `%s`\n\n' "${{ steps.runner.outputs.image }}"
            printf 'This draft is the immutable candidate. Promotion publishes it only after an operator-authorized AWS and GCP qualification verdict, attached as `qualification-verdict.json`, refers to this exact revision, bundle and runner.\n'
          } >"$candidate_notes"
          if gh release view "$VERSION" --json isDraft --jq .isDraft >"$RUNNER_TEMP/is-draft.txt" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/is-draft.txt")" != "true" ]; then
              echo "::error::$VERSION is already published, and a version is published once"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/existing-candidate"
            gh release download "$VERSION" --dir "$RUNNER_TEMP/existing-candidate" --pattern candidate.json
            if ! python3 internal/tooling/release/promotion.py same \
              --left "$RUNNER_TEMP/existing-candidate/candidate.json" \
              --right "$RUNNER_TEMP/candidate.json"; then
              echo "::error::a candidate for $VERSION is already recorded and differs from this rebuild; refusing to move it"
              exit 1
            fi
            echo "the candidate for $VERSION is already recorded and matches this rebuild; nothing to publish"
          else
            gh release create "$VERSION" \
              "${{ steps.bundle.outputs.archive }}" "$RUNNER_TEMP/candidate.json" \
              --draft --verify-tag --title "Sol $VERSION (candidate)" \
              --notes-file "$candidate_notes"
            echo "recorded the draft candidate for $VERSION"
          fi
