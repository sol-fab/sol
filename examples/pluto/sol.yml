project: pluto

resources:
  app_db:
    type: postgres

  events:
    type: kafka

services:
  checkout_svc:
    type: http
    path: app/checkout/checkout_svc
    language: ocaml

  charge_svc:
    type: http
    path: app/payments/charge_svc
    uses: [app_db, events]
    language: ocaml

  notify_worker:
    type: worker
    path: app/comms/notify_worker
    uses: [app_db, events]
    language: ocaml

  orders_svc:
    type: http
    path: app/payments/orders_svc
    uses: [app_db, events]
    language: ocaml

  fulfilment_worker:
    type: worker
    path: app/comms/fulfilment_worker
    uses: [app_db, events]
    language: ocaml

  # The production profile does not yet qualify TypeScript workloads.
  order_svc:
    type: http
    path: app/demo_ts/order_svc
    uses: [app_db]
    language: typescript

  fulfillment_worker:
    type: worker
    path: app/demo_ts/fulfillment_worker
    uses: [app_db]
    language: typescript
