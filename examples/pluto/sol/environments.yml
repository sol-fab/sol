# Keep account-specific values in the ignored `sol/environments.local.yml`.

# The production environment, without the production profile: an environment's
# name never selects one (see pilot).
prod:
  base_domain: pluto.example.com
  shape: local
  # Sol creates this zone once in the installation and owns it: every environment on
  # this domain shares it, and no environment destroy removes it.
  dns_zone_ownership: sol
  letsencrypt_email: ops@pluto.example.com
  # Spare capacity for one node failure.
  node_failure_headroom_nodes: 1
  resources:
    app_db:
      size: small
  services:
    charge_svc:
      scale:
        min: 1
        max: 2
    notify_worker:
      scale:
        min: 1
        max: 2
    orders_svc:
      scale:
        min: 1
        max: 2
    fulfilment_worker:
      scale:
        min: 1
        max: 2
    probe_fn:
      omit: true
    probe_ts_fn:
      omit: true
  targets:
    aws/us-east-1:
      cluster_name: pluto-prod

# Selects the production-single-region profile explicitly.
#
# `sol deploy pilot/aws/us-east-1 --dry-run --image-tag <tag>` runs the profile
# preflight, which refuses until this target establishes every guarantee the
# profile requires, listing each unmet guarantee and who must act.
#
# Configure a real alert receiver; never embed routing credentials in its URL.
pilot:
  profile: production-single-region
  shape: durable
  base_domain: pluto.example.com
  dns_zone_ownership: sol
  letsencrypt_email: ops@pluto.example.com
  alert_receiver_type: webhook
  alert_receiver_url: https://alerts.example.com/sol/webhook
  alert_owner: pluto-oncall
  alert_runbook_url: https://runbooks.example.com/sol
  node_failure_headroom_nodes: 1
  services:
    probe_fn:
      omit: true
    probe_ts_fn:
      omit: true
  targets:
    aws/us-east-1:
      cluster_name: pluto-pilot
      kube_context: pluto-pilot
      registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      # Managed Kafka credentials are resource-owned: the deploy resolves the target's
      # Kafka binding and writes `<target>-kafka-creds` for declared consumers. Do not
      # map KAFKA_SASL_PASSWORD or KAFKA_SSL_CA_CERT under `secrets:`; a second producer
      # is refused.

# A low-cost development environment: Postgres, Kafka and the services that
# need them are omitted, so `sol deploy dev/aws/us-east-1` provisions the
# cluster and the platform only. Replace the domain and contact address.
dev:
  base_domain: dev.pluto.example.com
  shape: local
  # The developer registered this one, so Sol deploys into it and never removes it.
  dns_zone_ownership: user
  cluster_issuer: letsencrypt-staging
  letsencrypt_email: ops@pluto.example.com
  resources:
    app_db:
      omit: true
    events:
      omit: true
  services:
    charge_svc:
      omit: true
    notify_worker:
      omit: true
    orders_svc:
      omit: true
    fulfilment_worker:
      omit: true
    # These consume `app_db`, which this environment omits, so their binding has
    # no resource to select here either.
    order_svc:
      omit: true
    fulfillment_worker:
      omit: true
    probe_fn:
      omit: true
    probe_ts_fn:
      omit: true
  targets:
    aws/us-east-1:
      cluster_name: pluto-dev

# The customer-cloud environment the tutorial deploys to (docs/guides/tutorial.md,
# "Ingress"). Replace the domain and contact address with your own; pass
# `--registry` to `sol deploy`, or add `registry:` to the target.
customer_cloud:
  base_domain: customer.pluto.example.com
  shape: local
  # The customer's own DNS: Sol asks for the delegation and does not own the zone.
  dns_zone_ownership: external
  letsencrypt_email: ops@pluto.example.com
  services:
    probe_fn:
      omit: true
    probe_ts_fn:
      omit: true
  targets:
    aws/us-east-1:
      cluster_name: pluto-customer
    # BYO targets use an existing cluster; cloud lifecycle commands refuse them.
    byo/onprem:
      kube_context: pluto-customer
      registry: registry.example.com/pluto


# Experimental AWS serverless target for the two run-once probes. The target
# creates Lambda functions, versions, and the live alias only; it does not
# create a schedule, trigger, or queue. Task queues are deployed separately with
# `sol task aws` (see examples/pluto/SERVERLESS.md).
serverless:
  shape: local
  base_domain: serverless.pluto.example.com
  dns_zone_ownership: user
  resources:
    app_db:
      omit: true
    events:
      omit: true
  services:
    checkout_svc:
      omit: true
    charge_svc:
      omit: true
    notify_worker:
      omit: true
    orders_svc:
      omit: true
    fulfilment_worker:
      omit: true
    order_svc:
      omit: true
    fulfillment_worker:
      omit: true
    probe_ts_fn:
      omit: true
  targets:
    aws/us-east-1:
      execution: serverless
      aws:
        # Replace with an AWS profile and an existing Lambda execution role.
        profile: default


# The target-scoped serverless dispatch deploys exactly one service per target,
# so the TypeScript probe has its own environment/target selection.
serverless_ts:
  shape: local
  base_domain: serverless.pluto.example.com
  dns_zone_ownership: user
  resources:
    app_db:
      omit: true
    events:
      omit: true
  services:
    checkout_svc:
      omit: true
    charge_svc:
      omit: true
    notify_worker:
      omit: true
    orders_svc:
      omit: true
    fulfilment_worker:
      omit: true
    order_svc:
      omit: true
    fulfillment_worker:
      omit: true
    probe_fn:
      omit: true
  targets:
    aws/us-east-1:
      execution: serverless
      aws:
        profile: default

# Experimental GCP Cloud Run Jobs targets for the two run-once probes. Each
# target selects one -fn because target-scoped serverless dispatch deploys one
# service per target. Cloud Run Jobs has no schedule or trigger here.
serverless_gcp:
  shape: local
  base_domain: serverless.pluto.example.com
  dns_zone_ownership: user
  resources:
    app_db:
      omit: true
    events:
      omit: true
  services:
    checkout_svc:
      omit: true
    charge_svc:
      omit: true
    notify_worker:
      omit: true
    orders_svc:
      omit: true
    fulfilment_worker:
      omit: true
    order_svc:
      omit: true
    fulfillment_worker:
      omit: true
    probe_ts_fn:
      omit: true
  targets:
    gcp/us-west1:
      execution: serverless
      gcp:
        # Replace with the project that owns the Cloud Run Jobs.
        project_id: example-project
        region: us-west1

serverless_gcp_ts:
  shape: local
  base_domain: serverless.pluto.example.com
  dns_zone_ownership: user
  resources:
    app_db:
      omit: true
    events:
      omit: true
  services:
    checkout_svc:
      omit: true
    charge_svc:
      omit: true
    notify_worker:
      omit: true
