# Keep account-specific values in the ignored `sol/environments.local.yml`.

# The production environment, without the production profile: an environment's
# name never selects one (see pilot).
prod:
  base_domain: pluto.example.com
  shape: local
  # Sol creates this zone once in the installation and owns it: every environment on
  # this domain shares it, and no environment destroy removes it.
  dns_zone_ownership: sol
  letsencrypt_email: ops@pluto.example.com
  # Spare capacity for one node failure.
  node_failure_headroom_nodes: 1
  resources:
    app_db:
      size: small
  services:
    charge_svc:
      scale:
        min: 1
        max: 2
    notify_worker:
      scale:
        min: 1
        max: 2
    orders_svc:
      scale:
        min: 1
        max: 2
    fulfilment_worker:
      scale:
        min: 1
        max: 2
  targets:
    aws/us-east-1:
      cluster_name: pluto-prod

# Selects the production-single-region profile explicitly.
#
# `sol deploy pilot/aws/us-east-1 --dry-run --image-tag <tag>` runs the profile
# preflight, which refuses until this target establishes every guarantee the
# profile requires, listing each unmet guarantee and who must act.
#
# Configure a real alert receiver; never embed routing credentials in its URL.
pilot:
  profile: production-single-region
  shape: durable
  base_domain: pluto.example.com
  dns_zone_ownership: sol
  letsencrypt_email: ops@pluto.example.com
  alert_receiver_type: webhook
  alert_receiver_url: https://alerts.example.com/sol/webhook
  alert_owner: pluto-oncall
  alert_runbook_url: https://runbooks.example.com/sol
  node_failure_headroom_nodes: 1
  targets:
    aws/us-east-1:
      cluster_name: pluto-pilot
      kube_context: pluto-pilot
      registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      secrets:
        payments/charge_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        payments/orders_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        comms/notify_worker:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        comms/fulfilment_worker:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        checkout/checkout_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        demo_ts/order_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        demo_ts/fulfillment_worker:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol

# A low-cost development environment: Postgres, Kafka and the services that
# need them are omitted, so `sol deploy dev/aws/us-east-1` provisions the
# cluster and the platform only. Replace the domain and contact address.
dev:
  base_domain: dev.pluto.example.com
  shape: local
  # The developer registered this one, so Sol deploys into it and never removes it.
  dns_zone_ownership: user
  cluster_issuer: letsencrypt-staging
  letsencrypt_email: ops@pluto.example.com
  resources:
    app_db:
      omit: true
    events:
      omit: true
  services:
    charge_svc:
      omit: true
    notify_worker:
      omit: true
    orders_svc:
      omit: true
    fulfilment_worker:
      omit: true
    # These consume `app_db`, which this environment omits, so their binding has
    # no resource to select here either.
    order_svc:
      omit: true
    fulfillment_worker:
      omit: true
  targets:
    aws/us-east-1:
      cluster_name: pluto-dev

# The customer-cloud environment the tutorial deploys to (docs/guides/TUTORIAL.md,
# "Ingress"). Replace the domain and contact address with your own; pass
# `--registry` to `sol deploy`, or add `registry:` to the target.
customer_cloud:
  base_domain: customer.pluto.example.com
  shape: local
  # The customer's own DNS: Sol asks for the delegation and does not own the zone.
  dns_zone_ownership: external
  letsencrypt_email: ops@pluto.example.com
  targets:
    aws/us-east-1:
      cluster_name: pluto-customer
    # BYO targets use an existing cluster; cloud lifecycle commands refuse them.
    byo/onprem:
      kube_context: pluto-customer
      registry: registry.example.com/pluto
