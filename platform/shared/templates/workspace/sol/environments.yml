# Each environment sets policy once, and
# This is a placeholder: rename the environment and target to your real ones,
# and set the SOL_TARGET repository variable in GitHub (used by
# .github/workflows/sol-ci.yml) to match.
#
# Account-specific values can go in ignored `sol/environments.local.yml`.
prod:
  targets:
    aws/us-east-1:
      # registry: <your-registry-url>
      secrets:
        # 2b: no POSTGRES_URL copy. A unit that consumes the workspace's `app_db`
        # resource reads the target's `<target>-dml-creds` class Secret, delivered by
        # the deploy; declare `uses: [app_db]` on the service to receive it. Map only
        # application secrets the unit declares under `[infra.env] secrets`.
        payments/charge_svc:
          SOL_API_KEY:
            authority: sol
        comms/notify_worker:
          SOL_API_KEY:
            authority: sol
