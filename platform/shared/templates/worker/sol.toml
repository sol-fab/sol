# Sol service configuration — all fields are optional.

[infra.scale]
# replicas = 1
# cpu      = "250m"
# memory   = "256Mi"

[infra.env]
# secrets = []
# config  = {}

[infra.rollout]
# strategy = "canary"       # or "blue-green"
# steps    = [10, 40, 100]  # canary only

# Declare the topic this worker consumes when you wire it to an event. The
# topic makes the deploy render the worker's /readyz and /livez probes:
# [service]
# topics = ["<team>-<event>s"]
