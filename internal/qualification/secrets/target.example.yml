# EXAMPLE target for the provider-backed secret scenario. Copy to a private
# workspace/environments file, replace every placeholder, and keep it out of Git.
# It deliberately declares no profile, database or Kafka resource: the scenario
# verifies the secret authority/projection contract with one worker fixture.
qual:
  targets:
    aws/us-east-1:
      shape: durable
      cluster_name: <cluster-name>
      kube_context: <cluster-name>
      base_domain: <your-domain>
      cluster_issuer: letsencrypt-staging
      letsencrypt_email: <ops@your-domain>
      registry: <account>.dkr.ecr.us-east-1.amazonaws.com
      terraform_var_file: <absolute path to internal/qualification/aws/qual.tfvars>
      state_bucket: <globally-unique-bucket>
      destroy_retention: none
      aws:
        state_lock_table: <lock-table>
        provisioner_role_arn: arn:aws:iam::<account>:role/<provisioner-role>
        cluster_access_role_arn: arn:aws:iam::<account>:role/<cluster-access-role>
        deploy_role_arn: arn:aws:iam::<account>:role/<deploy-role>
        operator_role_arn: arn:aws:iam::<account>:role/<operator-role>
      secrets:
        probe/secret_probe_worker:
          SOL_PROBE_SECRET:
            authority: sol

    gcp/us-central1:
      shape: durable
      cluster_name: <cluster-name>
      kube_context: <cluster-name>
      base_domain: <your-domain>
      cluster_issuer: letsencrypt-staging
      letsencrypt_email: <ops@your-domain>
      registry: <region>-docker.pkg.dev/<project>/<repository>
      terraform_var_file: <absolute path to internal/qualification/gcp/qual.tfvars>
      state_bucket: <globally-unique-bucket>
      destroy_retention: none
      gcp:
        project_id: <project-id>
        provisioner_impersonator: <impersonator-service-account>
        publisher_service_account: <publisher-service-account>
      secrets:
        probe/secret_probe_worker:
          SOL_PROBE_SECRET:
            authority: sol
