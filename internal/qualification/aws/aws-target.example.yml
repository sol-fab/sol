# EXAMPLE qualification target for AWS — not a runnable target.
# Copy to `<workspace>/sol/environments.local.yml` and replace placeholders.
# The run procedure and matrix define what qualification asserts.
qual:
  targets:
    aws/us-east-1:
      profile: production-single-region
      cluster_name: <cluster-name>          # also names the VPC, NAT gateways and EIPs
      base_domain: <your-domain>
      dns_zone_ownership: sol        # sol | user | external -- who owns the zone
      letsencrypt_email: <ops@your-domain>
      kube_context: <cluster-name>
      registry: <account>.dkr.ecr.us-east-1.amazonaws.com

      # Terraform variables for the cluster and platform roots (node sizes, RDS flags).
      # `sol deploy` takes no --var-file, so the target names the file the roots read.
      terraform_var_file: <absolute path to internal/qualification/aws/qual-aws-row.tfvars>

      # Name the remote state backend created during bootstrap.
      state_bucket: <globally-unique-bucket>

      # Keep Kubernetes access separate from cloud provisioning authority.
      aws:
        state_lock_table: <lock-table>
        provisioner_role_arn: arn:aws:iam::<account>:role/<provisioner-role>
        cluster_access_role_arn: arn:aws:iam::<account>:role/<cluster-access-role>
        deploy_role_arn: arn:aws:iam::<account>:role/<deploy-role>
        operator_role_arn: arn:aws:iam::<account>:role/<operator-role>

      cluster_endpoint_cidr: <your-egress-cidr>

      alert_receiver_type: webhook
      alert_receiver_url: <https://your-receiver-endpoint>
      alert_owner: <accountable-owner>
      alert_runbook_url: <https://your-runbook>

      node_failure_headroom_nodes: 1

      destroy_retention: none

      # This target selects a profile, and a profiled target requires an authority for every
      # key its units need. The production profile's Kafka is authenticated, so every unit
      # this target includes needs these two declared; the platform supplies them, so the
      # authority is `sol`.
      secrets:
        checkout/checkout_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        payments/charge_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        payments/orders_svc:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        comms/notify_worker:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol
        comms/fulfilment_worker:
          KAFKA_SASL_PASSWORD:
            authority: sol
          KAFKA_SSL_CA_CERT:
            authority: sol

      # This profile qualifies OCaml workloads only.
      services:
        order_svc:
          omit: true

        fulfillment_worker:
          omit: true
